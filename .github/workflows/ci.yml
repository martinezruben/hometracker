name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hometracker
    steps:
      - name: MySQL 8 (preinstalado en el runner)
        run: |
          sudo systemctl start mysql.service
          mysql --version
          mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS hometracker CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; SELECT VERSION();"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Migraciones
        run: npm run db:migrate
      - name: Pruebas (incluye integración con MySQL)
        run: npm test
      - name: Build
        run: npm run build
      - name: Navegador para pruebas end-to-end
        run: npx playwright install --with-deps chromium
      - name: Pruebas end-to-end (Playwright, incluye accesibilidad)
        run: npm run e2e
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
